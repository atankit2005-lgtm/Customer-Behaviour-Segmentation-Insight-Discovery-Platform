[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-behaviour-segmentation-insight-discovery-platform"
version = "0.1.0"
description = "End-to-end customer behaviour segmentation and churn insight platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    { name = "Customer Behaviour Segmentation & Insight Discovery Platform Team" }
]
dependencies = [
    "joblib>=1.4",
    "pydantic>=2.8",
]

[dependency-groups]
data = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "openpyxl>=3.1",
]

ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
]

app = [
    "streamlit>=1.40",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

